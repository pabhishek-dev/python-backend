<!DOCTYPE html>
<html>
<head>
    <title>Live Products</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .product { border: 1px solid #ccc; padding: 10px; margin: 5px 0; }
        .product img { max-width: 100px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>Live Products</h1>
    <div id="products"></div>

    <script>
        const productsDiv = document.getElementById("products");

        // Connect to SSE
        const evtSource = new EventSource("https://localhost:4443/stream");

        evtSource.onmessage = function(event) {
            try {
                const product = JSON.parse(event.data);

                const div = document.createElement("div");
                div.className = "product";
                div.innerHTML = `
                    <strong>${product.name}</strong> - ₹${product.price}<br>
                    Stock: ${product.stock}<br>
                    Rating: ${product.rating}<br>
                    Description: ${product.desc}<br>
                    <img src="${product.imageUrl}" alt="${product.name}">
                `;
                productsDiv.prepend(div); // newest on top
            } catch (err) {
                console.error("Failed to parse SSE data:", err);
            }
        };

        evtSource.onerror = function(err) {
            console.error("SSE connection error:", err);
        };
    </script>
</body>
</html>
